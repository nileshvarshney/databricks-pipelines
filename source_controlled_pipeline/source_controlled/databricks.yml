# This is a Databricks asset bundle definition for source_controlled.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: source_controlled
  uuid: d1d5c978-a011-479b-9eaf-d88f8763102a

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-85128ce8-da2a.cloud.databricks.com
    variables:
      catalog: learn_catalog
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-85128ce8-da2a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/nilesh.varshney@yahoo.com to make sure we only have a single copy.
      root_path: /Workspace/Users/nilesh.varshney@yahoo.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: learn_catalog
      schema: prod
    permissions:
      - user_name: nilesh.varshney@yahoo.com
        level: CAN_MANAGE
